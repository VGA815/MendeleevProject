  Platforms:
    - Id: "android"
      Title: "Android"
      Instruction: |-
        <b>Android</b>
        1. Установите Happ из Google Play или с сайта happ.su.
        2. Нажмите «Добавить в Happ» ниже — или скопируйте ссылку и добавьте её в приложении через «+».
        3. Разрешите добавление VPN-конфигурации.
        4. Подключитесь: выберите локацию или автовыбор.
        5. Проверьте: откройте любой ранее недоступный сайт.
        Не работает — загляните в FAQ или напишите в поддержку.

        Запасной клиент с поддержкой HWID: v2RayTun.
        Приложение банка можно исключить из VPN в настройках Happ (маршрутизация по приложениям).
    - Id: "ios"
      Title: "iPhone и iPad"
      Instruction: |-
        <b>iPhone и iPad</b>
        1. Установите Happ. Три пути:
           • найдите Happ в App Store (название в сторе может меняться);
           • если приложения нет в российском App Store — смените регион Apple ID;
           • или установите запасной клиент с поддержкой HWID — v2RayTun.
        2. Нажмите «Добавить в Happ» ниже — или скопируйте ссылку и добавьте её в приложении.
        3. Разрешите добавление VPN-конфигурации.
        4. Подключитесь: выберите локацию или автовыбор.
        5. Проверьте: откройте любой ранее недоступный сайт.
        Не работает — загляните в FAQ или напишите в поддержку.
    - Id: "windows"
      Title: "Windows"
      Instruction: |-
        <b>Windows</b>
        1. Установите Happ для Windows с сайта happ.su.
        2. Нажмите «Добавить в Happ» ниже — или скопируйте ссылку и добавьте её в приложении.
        3. Разрешите приложению настраивать сеть.
        4. Подключитесь: выберите локацию или автовыбор.
        5. Проверьте: откройте любой ранее недоступный сайт.
        Не работает — загляните в FAQ или напишите в поддержку.

        Запасной клиент с поддержкой HWID: FlClashX или Koala Clash.
    - Id: "macos"
      Title: "macOS"
      Instruction: |-
        <b>macOS</b>
        1. Установите Happ из App Store.
        2. Нажмите «Добавить в Happ» ниже — или скопируйте ссылку и добавьте её в приложении.
        3. Разрешите добавление VPN-конфигурации.
        4. Подключитесь: выберите локацию или автовыбор.
        5. Проверьте: откройте любой ранее недоступный сайт.
        Не работает — загляните в FAQ или напишите в поддержку.

        Запасной клиент с поддержкой HWID: FlClashX.

  Faq:
    - Id: "no-connect"
      Question: "Не подключается"
      Answer: "Обновите подписку в приложении, выберите другую локацию или запасной профиль, перезапустите приложение. Не помогло — напишите в поддержку."
    - Id: "no-sites"
      Question: "«Подключено», но сайты не открываются"
      Answer: "Выберите запасной профиль (другой транспорт) и обновите подписку в приложении."
    - Id: "mobile"
      Question: "Не работает на мобильном интернете"
      Answer: "Первая версия сервиса гарантирует работу на домашнем интернете и Wi-Fi. Мобильные сети — позже, в тарифе Премиум."
    - Id: "bank"
      Question: "Не работает приложение банка или Госуслуги"
      Answer: "Российские сайты идут напрямую, но часть приложений замечает сам факт VPN — для них выключите VPN. На Android приложение можно исключить в настройках Happ."
    - Id: "devices-limit"
      Question: "Превышен лимит устройств"
      Answer: "Сбросьте устройства в разделе «Устройства» — они подключатся заново при следующем обновлении подписки."
    - Id: "new-device"
      Question: "Как перенести подписку на новое устройство"
      Answer: "Откройте «Подключить устройство» на новом устройстве или отсканируйте QR-код ссылки. Если упрётесь в лимит — сбросьте устройства."
    - Id: "ios-store"
      Question: "Happ пропал из App Store"
      Answer: "Три пути: найдите приложение в App Store под новым названием, смените регион Apple ID или установите запасной клиент v2RayTun."
    - Id: "paid-no-access"
      Question: "Оплата прошла, а доступа нет"
      Answer: "Нажмите «Проверить оплату» под сообщением с оплатой: перевод подтверждается в сети обычно за несколько минут. Если доступ не появился за 15 минут или счёт ждёт доплаты — напишите в поддержку."
    - Id: "no-telegram"
      Question: "Не работает Telegram"
      Answer: "Войдите на сайт по ключу аккаунта — получите его заранее в разделе «Вход на сайт»."
    - Id: "update"
      Question: "Как обновить подписку вручную"
      Answer: |-
        <b>Android, iOS, macOS:</b> в Happ потяните список серверов вниз или нажмите значок обновления рядом с подпиской.
        <b>Windows:</b> в Happ нажмите «Обновить» у подписки.
