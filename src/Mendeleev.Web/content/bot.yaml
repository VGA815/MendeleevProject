      Оплата криптовалютой (USDT и другие) на странице платёжного сервиса, рубли пересчитываются по курсу на момент создания счёта. Комиссию сети и биржи добавьте сверх суммы счёта: если придёт меньше, счёт будет ждать доплаты. Срок прибавится к текущему.

