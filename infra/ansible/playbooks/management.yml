# Management VPS baseline (ТЗ 40; NFR-19, NFR-20): the deploy user with keys, no root and no passwords over
# SSH, fail2ban, automatic security updates, ufw with 22, 80 and 443, Docker with the compose plugin. deploy/
# is set up by hand (docs/staging.md, step 7); Docker publishes its ports past ufw, so compose publishes only
# Caddy's 80 and 443.
#   ansible-playbook playbooks/management.yml
- name: Management VPS
  hosts: management
  become: true
  roles:
    - role: common
      vars:
        firewall_rules:
          - { port: 80, proto: tcp }
          - { port: 443, proto: tcp }
    - docker
