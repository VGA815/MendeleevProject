# Copy to inventory.ini (ignored by Git). Two countries, two hosters (ТЗ 25).
# node_code is also the Remnawave host tag used by infra/scripts/replace-node.sh.

[nodes]
node-de1 ansible_host=203.0.113.10 node_code=DE1
node-nl1 ansible_host=203.0.113.20 node_code=NL1
node-fi1 ansible_host=203.0.113.30 node_code=FI1

# Warm reserve: installed and connected to the panel, its hosts disabled (not in subscriptions).
[reserve]
node-res1 ansible_host=203.0.113.40 node_code=RES1

# Probes in different Russian DCs: real connections through every node and transport every 5 minutes.
[probes]
probe-msk ansible_host=198.51.100.10 probe_name=msk
probe-spb ansible_host=198.51.100.20 probe_name=spb

[vpn:children]
nodes
reserve

[all:vars]
ansible_user=deploy
