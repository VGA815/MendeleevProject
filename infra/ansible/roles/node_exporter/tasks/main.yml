# Channel load, CPU and disk of the node (NFR-06; Prometheus comes in stage 1.5).
- name: node_exporter binary
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: node_exporter service
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus node exporter
      After=network-online.target

      [Service]
      User=nobody
      ExecStart=/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter --web.listen-address=:9100
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: node_exporter is running
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
