# Local development: PostgreSQL only. The service runs from the IDE / `dotnet run` with
# appsettings.Development.json (in-memory panel, fake aggregator, migrations on start).
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: mendeleev-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mendeleev
      POSTGRES_USER: mendeleev
      POSTGRES_PASSWORD: mendeleev
    ports:
      - "5432:5432"
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mendeleev -d mendeleev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-postgres:
