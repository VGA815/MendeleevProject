# ТЗ 40, «Сборка и поставка»: build → tests (xUnit + Testcontainers) → vulnerable packages → image →
# private registry, tagged with the commit. Release to the VPS is deploy/scripts/release.sh over SSH.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MendeleevProject.slnx

      - name: Build
        run: dotnet build MendeleevProject.slnx -c Release --no-restore

      # Integration tests start PostgreSQL through Testcontainers — Docker is available on the runner.
      # The contract tests have their own job below.
      - name: Test
        run: |
          for project in tests/Mendeleev.UnitTests tests/Mendeleev.ArchitectureTests tests/Mendeleev.IntegrationTests; do
            dotnet test "$project" -c Release --no-build --logger "trx;LogFilePrefix=results"
          done

      - name: Vulnerable packages
        run: |
          dotnet list MendeleevProject.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # ТЗ 50, «Контрактные»: the Remnawave adapter against the pinned panel in Docker (REMNAWAVE_TAG from
  # deploy/panel/.env.example). A PR that bumps the tag is the check before updating the panel.
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Contract tests (Remnawave)
        run: dotnet test tests/Mendeleev.ContractTests -c Release --logger "trx;LogFilePrefix=contract"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-results
          path: "**/TestResults/*.trx"

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/backup/*.sh deploy/scripts/*.sh deploy/postgres/init/*.sh infra/probes/*.sh infra/scripts/*.sh infra/routing/*.sh
      - name: Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_DOMAIN=a.test -e SITE_DOMAIN_RESERVE=b.test -e SUB_DOMAIN=c.test -e SUB_DOMAIN_RESERVE=d.test -e WEBHOOK_DOMAIN=e.test -e ACME_EMAIL=x@a.test caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/deploy/panel/Caddyfile:/etc/caddy/Caddyfile:ro" -e PANEL_DOMAIN=p.test -e PANEL_PORT=9443 -e PANEL_ALLOWED_IPS="192.0.2.1 192.0.2.2" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

  images:
    needs: [build-test, contract-tests, lint-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Image names must be lowercase, the owner's name may be not.
      - name: Registry
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Mendeleev.Web/Dockerfile
          target: final
          push: true
          tags: ${{ env.REGISTRY }}/mendeleev-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migration bundle image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Mendeleev.Web/Dockerfile
          target: migrator
          push: true
          tags: ${{ env.REGISTRY }}/mendeleev-migrator:${{ github.sha }}
          cache-from: type=gha

      # Staging only: the load test of ТЗ 50 (deploy/docker-compose.staging.yml).
      - name: Load test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Mendeleev.LoadTest/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/mendeleev-loadtest:${{ github.sha }}
